# Render blueprint. Point Render at this file and it provisions the API service
# and its environment in one step.
#
# Only the backend is here. The frontend is a Next app better served by Vercel's
# edge network, and splitting them keeps each host doing what it is good at.
services:
  - type: web
    name: signal-clone-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend

    buildCommand: pip install .

    # Migrations and seeding run at boot rather than at build.
    #
    # Render's free tier provides no persistent disk, so the filesystem — and
    # therefore the SQLite database — is recreated whenever the instance
    # restarts, which on free tier happens after idle spin-down. Seeding at build
    # time would produce a database that exists only until the first restart, and
    # the demo would then come back up empty.
    #
    # Both commands are idempotent: alembic is a no-op once at head, and the
    # seeder detects existing data and stops. So this is cheap when state does
    # survive and self-healing when it does not.
    startCommand: >-
      alembic upgrade head &&
      python scripts/seed.py &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /api/v1/health

    envVars:
      - key: ENVIRONMENT
        value: production
      # The brief permits mocked verification, and this demo has no SMS
      # provider. With it off, codes would be random and undeliverable, so
      # nobody could sign in at all.
      - key: MOCK_VERIFICATION
        value: "true"
      # The API is meant to be explored by a reviewer, so the interactive docs
      # stay available on this deployment.
      - key: ENABLE_DOCS
        value: "true"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./var/signal.db
      - key: UPLOAD_DIR
        value: ./var/uploads
      # Generated by Render and never seen by anyone, which is what a signing key
      # should be.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set to the Vercel URL once the frontend is deployed. Credentialed CORS
      # forbids a wildcard, so this must be the real origin.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
