# Render blueprint. Point Render at this file and it provisions the API service,
# its persistent disk and its environment in one step.
#
# Only the backend is here. The frontend is a static-ish Next app better served
# by Vercel's edge network, and splitting them keeps each host doing what it is
# good at.
services:
  - type: web
    name: signal-clone-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install . && alembic upgrade head && python scripts/seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health

    # SQLite needs a real filesystem that survives a redeploy. Without this the
    # database is recreated empty every time the service restarts.
    disk:
      name: signal-data
      mountPath: /opt/render/project/src/backend/var
      sizeGB: 1

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./var/signal.db
      - key: UPLOAD_DIR
        value: ./var/uploads
      # Generated by Render and never seen by anyone, which is exactly what a
      # signing key should be.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set to the Vercel URL after the frontend is deployed. Credentialed CORS
      # forbids a wildcard, so this has to be the real origin.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
