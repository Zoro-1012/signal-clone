# Local full-stack run: `docker compose up --build`, then open http://localhost:3000
services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///./var/signal.db
      UPLOAD_DIR: ./var/uploads
      JWT_SECRET_KEY: local-development-signing-key-at-least-32-bytes
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:8000
    volumes:
      # Named volume, not a bind mount: SQLite needs POSIX locking, which some
      # host filesystems do not provide through a bind mount.
      - api-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
