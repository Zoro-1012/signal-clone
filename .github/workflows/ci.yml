name: CI

# Every push and every pull request. A green main is the contract: if CI passes,
# the tree lints, type-checks, tests and builds.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer commit makes an in-flight run obsolete — cancel it rather than pay for it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    # The frontend is built after the backend, so for part of this project's
    # history frontend/ does not exist. A job that fails because a directory is
    # not there yet trains everyone to ignore red CI, which is worse than having
    # no CI at all — so the workload is detected and skipped honestly instead.
    name: Detect workspaces
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ is not present yet - skipping its checks."
          fi

  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-signing-key-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (black)
        run: black --check app tests

      - name: Type check (mypy, strict)
        run: mypy app

      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing

      - name: Migrations apply cleanly and are reversible
        # A migration that cannot be rolled back is a one-way door. Proving the
        # round trip here is what stops that being discovered in production.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./var/ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend · lint, types, build
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
